# ブラウザ版（Wasm フォルダ）を発行して GitHub Pages に置く。main に push するたびに実行する。
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # 実行環境に入っている新しい SDK ではなく .NET 8 SDK を使う
      - run: echo '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' > global.json

      # AOT コンパイル（シミュレーションを速くする）に必要
      - run: dotnet workload install wasm-tools

      - run: dotnet publish Wasm/PaifuEditor.Wasm.csproj -c Release -o out -p:RunAOTCompilation=true

      # https://<ユーザー名>.github.io/<リポジトリ名>/ に置くため base を合わせる
      - run: |
          sed -i 's#<base href="/" />#<base href="/${{ github.event.repository.name }}/" />#' out/wwwroot/index.html
          cp out/wwwroot/index.html out/wwwroot/404.html
          touch out/wwwroot/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
